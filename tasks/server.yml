- name: Create easy-rsa configuration for OpenVPN
  template:
    src: easy-rsa/vars.j2
    dest: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/vars"
    owner: root
    group: root
    mode: '0644'

- name: Create script for client config generation
  template:
    src: easy-rsa/clientconfig.j2
    dest: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/clientconfig"
    owner: root
    group: root
    mode: '0744'

- name: Create script for client config sending
  template:
    src: easy-rsa/sendconfig.j2
    dest: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/sendconfig"
    owner: root
    group: root
    mode: '0744'
  when: openvpn_send_config == true

- name: Init PKI
  command: "./easyrsa init-pki"
  args:
    chdir: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/"
    creates: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/pki"

- name: Create CA
  command: "./easyrsa --batch build-ca nopass"
  args:
    chdir: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/"
    creates: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/pki/ca.crt"
  environment:
    EASYRSA_REQ_CN: "ca.{{ openvpn_hostname }}"

- name: Create DH
  command: "./easyrsa --batch gen-dh"
  args:
    chdir: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/"
    creates: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/pki/dh.pem"

- name: Generate CRL
  command: "./easyrsa --batch gen-crl"
  args:
    chdir: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/"

# server.conf runs OpenVPN as nobody:nogroup, and it re-stats crl.pem on every
# handshake. easyrsa writes the pki under umask 077, so without this the daemon
# logs "Failed to stat CRL file, not reloading CRL" and keeps serving whatever
# it read at startup - until that copy passes its nextUpdate and every
# handshake fails with "CRL has expired".
- name: Make the CRL readable by the unprivileged OpenVPN process
  file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "/etc/openvpn/server/{{ openvpn_name }}"
      mode: "0755"
    - path: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa"
      mode: "0755"
    # 0751: traversable but not listable; pki/private keeps its own 0700.
    - path: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/pki"
      mode: "0751"
    - path: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/pki/crl.pem"
      mode: "0644"

# The CRL is otherwise only regenerated by a full apply, so any gap longer than
# EASYRSA_CRL_DAYS (default 180) runs it past nextUpdate. chmod again because
# easyrsa rewrites the file 0600.
- name: Refresh the CRL daily
  cron:
    name: refresh crl
    minute: "0"
    hour: "2"
    user: root
    job: >-
      cd /etc/openvpn/server/{{ openvpn_name }}/easy-rsa/ &&
      ./easyrsa --batch gen-crl && chmod 0644 pki/crl.pem

# Fails the play on the two states that caused the outage: the CRL unreadable
# by the account OpenVPN actually runs as, or already inside its last 30 days.
# runuser rather than become_user, which would need a world-readable remote
# tmpdir to hand the module over to an unprivileged account.
- name: Verify the CRL is readable by nobody and not near expiry
  shell: |
    set -eu
    crl=/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/pki/crl.pem
    next=$(runuser -u nobody -- openssl crl -in "$crl" -noout -nextupdate | cut -d= -f2)
    test "$(date -d "$next" +%s)" -gt "$(date -d '+30 days' +%s)"
  changed_when: false

# No EASYRSA_REQ_CN here: build-server-full takes the common name as its
# positional argument, and easy-rsa 3.1+ rejects setting it externally with
# "Option conflict: 'build-server-full' does not support setting an external
# commonName". 3.0.8 tolerated it. build-ca above still needs it - that
# subcommand has no positional CN.
- name: Sign server certificate request
  command: "./easyrsa --batch build-server-full {{ openvpn_hostname }} nopass"
  args:
    chdir: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/"
    creates: "/etc/openvpn/server/{{ openvpn_name }}/easy-rsa/pki/issued/{{ openvpn_hostname }}.crt"
  notify: restart openvpn

- name: Create server configuration for OpenVPN
  template:
    src: openvpn/server/server.conf.j2
    dest: "/etc/openvpn/server/{{ openvpn_name }}.conf"
    owner: root
    group: root
    mode: '0644'
  notify: restart openvpn

- name: Enable systemd openvpn service
  systemd:
    name: "openvpn-server@{{ openvpn_name }}"
    enabled: yes
    masked: no
